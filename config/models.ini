version = 1

; llama-server router presets for an AMD BC-250 (16 GB unified GDDR6).
;   llama-server --models-preset /etc/llama/models.ini --models-max 1 --host 0.0.0.0 --port 8080
; Clients pick a preset with the "model" field of an OpenAI-style request.
; Keys are llama-server's own command-line options without the leading dashes.
; All figures below were measured on one board: 40 CU, GPU capped at 1500 MHz.

[*]
n-gpu-layers = 99
flash-attn = on
threads = 6
; Prefill micro-batch. Qwen3.6-35B-A3B, pp2048: ub 512 (default) 650 tok/s,
; 1024 823, 2048 946 (+45 %); with 8K tokens already in context 531 -> 728.
; If a model does not fit, lower it to 1024 in that model's section.
batch-size = 2048
ubatch-size = 2048
; Sampling on the GPU (experimental upstream). Server generation 79.6 -> 83.0 tok/s
; with Qwen3.6: the ~248K-token vocabulary is no longer scanned on the CPU per token.
backend-sampling = true
; Read the whole file without mmap: on unified memory this avoids holding the
; weights twice (page cache + GPU buffer). Alternative: dio.
load-mode = none
; 1 slot. With two clients (e.g. Open WebUI + Home Assistant) use 2 slots sharing
; one KV cache so each keeps its own prompt cache:
;   parallel = 2
;   kv-unified = true
parallel = 1
jinja = true
; The prompt cache may otherwise grow to 8 GiB of system RAM, which on this board
; is the same memory the model lives in.
cache-ram = 1024
; Context checkpoints for hybrid models (Qwen3.5/3.6). Without them the whole
; prompt is reprocessed every turn (measured: 3.4K-token system prompt, 2nd turn
; 4.1 s -> 0.3 s).
ctx-checkpoints = 8
checkpoint-min-step = 1024

; General purpose and agents. ~10.7 GiB of weights. 83 tok/s, 946 tok/s prefill.
[qwen36-moe]
; Loaded when the service starts; never unloaded unless another preset is requested.
load-on-startup = true
model = /models/Qwen3.6-35B-A3B-UD-IQ2_M.gguf
ctx-size = 32768
cache-type-k = q8_0
cache-type-v = q8_0
reasoning = off
temp = 0.7
top-p = 0.8
top-k = 20

; Same model with reasoning on (slower per answer).
[qwen36-moe-think]
model = /models/Qwen3.6-35B-A3B-UD-IQ2_M.gguf
ctx-size = 32768
cache-type-k = q8_0
cache-type-v = q8_0
reasoning = on
temp = 0.6
top-p = 0.95
top-k = 20

; Native MXFP4 checkpoint, always reasons first. Link the 12 GB MXFP4 file, not the
; eagle3-*.gguf drafts that ship in the same Hugging Face repo.
[gpt-oss-20b]
model = /models/gpt-oss-20b-mxfp4.gguf
ctx-size = 32768

; Vision.
[qwen35-9b]
model = /models/Qwen3.5-9B-Q4_K_M.gguf
mmproj = /models/mmproj-Qwen3.5-9B-F16.gguf
ctx-size = 32768
reasoning = off

; Classify, extract, route.
[granite-tiny]
model = /models/granite-4.0-h-tiny-Q4_K_M.gguf
ctx-size = 65536
